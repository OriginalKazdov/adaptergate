[project]
name = "adaptergate"
version = "0.5.0"
description = "CI gate for per-tenant LoRA adapters that update online. Slice-level reject explain. Serving-stack agnostic."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Kazdov"}]
keywords = ["llm", "lora", "regression", "continual-learning", "fine-tuning", "evaluation"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Core deps — JUST the gate. No torch, no transformers. Works anywhere.
dependencies = [
    "typer>=0.12",
    "pydantic>=2.9.0",
    "rich",
]

[project.optional-dependencies]
# ML stack for the serving examples + ProCL/Silent Collapse implementations.
ml = [
    "torch>=2.5.0",
    "transformers>=4.45.0",
    "peft>=0.13.0",
    "accelerate>=1.0.0",
    "bitsandbytes",
    "sentencepiece",
    "protobuf",
    "numpy",
    "pandas",
    "tqdm",
]
# vLLM serving integration (optional example).
serve = ["vllm"]
# BIRD-SQL example backing
sql-example = ["sqlglot>=25.0.0"]
# Developer tooling
dev = ["pytest", "ruff", "ipython"]

[project.scripts]
adaptergate = "adaptergate.cli:main"

[project.urls]
Homepage = "https://github.com/OriginalKazdov/adaptergate"
Repository = "https://github.com/OriginalKazdov/adaptergate"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adaptergate = ["data/*.jsonl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
